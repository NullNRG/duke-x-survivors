name: Publish Duke X browser preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify no GRP or embedded game data in published site
        run: |
          test -f site/index.html
          test -f site/eduke32.wasm
          test ! -f site/eduke32.data
          test ! -f site/DUKE3D.GRP
          ! grep -q 'loadPackage({files:\[{filename:"/DUKE3D.GRP"' site/eduke32.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v4
